name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.claude/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.claude/**']

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (libzbar)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzbar0

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt ruff==0.15.20 mypy

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type-check (mypy)
        run: mypy app --ignore-missing-imports || true

      - name: Run tests
        run: |
          # Invariant test is the hard gate — no single signal may breach HIGH_THRESHOLD.
          pytest tests/test_scoring_invariant.py -v
          # Full suite as a hard gate. One true integration test opens a real DB
          # connection (FastAPI resolves Depends(get_db) at import, so its patch is
          # a no-op) and needs a live Postgres — deselected here; it still runs
          # locally. To run it in CI, add a postgres service + `alembic upgrade head`.
          pytest tests/ -v --cov=app --cov-report=term-missing \
            --deselect tests/test_ingest_endpoint.py::test_ingest_returns_score_and_explanation

  ml:
    name: ML — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-ci.txt

      - name: Install Python dependencies
        # Minimal set — training-only deps (pandas, datasets) are excluded to keep
        # CI fast/cheap. See ml/requirements-ci.txt.
        run: pip install -r requirements-ci.txt

      - name: Run tests
        # The shared normalizer (text_normalize.py) and the inference wrapper are
        # the hard gate — they run at both training and inference time, so a
        # regression here silently poisons every production score. The one
        # real-model integration test skips automatically because ml/models/ is
        # gitignored (built at deploy time, never committed).
        run: pytest -v

  frontend:
    name: Frontend — type-check, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint || true

      - name: Run tests
        run: npm run test
