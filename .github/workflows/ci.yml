name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (libzbar)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzbar0

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/ || true  # warn but don't block on first pass

      - name: Type-check (mypy)
        run: mypy app --ignore-missing-imports || true

      - name: Run tests (scoring invariant must pass — others warn)
        run: |
          pytest tests/test_scoring_invariant.py -v  # hard fail
          pytest tests/ -v --cov=app --cov-report=term-missing || true

  frontend:
    name: Frontend — type-check, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint || true
