version: "3.9"

services:
  api:
    build:
      context: ./services
      dockerfile: Dockerfile.dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services:/app
      - ./ml/models:/app/ml/models:ro
      - ./ml/inference.py:/app/ml/inference.py:ro
      - ./ml/text_normalize.py:/app/ml/text_normalize.py:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
